<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chat Room</title>
    <link rel="stylesheet" href="/css/Chat.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<!-- Top Navigation Bar -->
<nav class="navbar">
    <div class="navbar-content">
        <a class="nav-btn" id="Home-link">Home</a>
        <a class="nav-btn" id="MyProfile-link">MyProfile</a>
        <a class="nav-btn" id="Chat-link">Chat</a>
        <a class="nav-btn" id="Logout-link">Logout</a>
        <div class="profile-photo">
            <img src="../assets/Images/lambo-story.jpg" alt="profile photo" />
        </div>
    </div>
</nav>

<!-- Main chat area, always centered below navbar -->
<main class="center-area">
    <div id="username-page">
        <div class="username-page-container">
            <h1 class="title">Type your username to enter the Chatroom</h1>
            <form id="usernameForm" name="usernameForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Username" autocomplete="off" class="form-control" />
                </div>
                <div class="form-group">
                    <button type="submit" class="accent username-submit">Start Chatting</button>
                </div>
            </form>
        </div>
    </div>

    <div id="chat-page" class="hidden">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Spring WebSocket Chat Demo - By ALibou</h2>
            </div>
            <div class="connecting">Connecting...</div>
            <ul id="messageArea"></ul>
            <form id="messageForm" name="messageForm">
                <div class="form-group">
                    <div class="input-group clearfix">
                        <input type="text" id="message" placeholder="Type a message..." autocomplete="off" />
                        <button type="submit" class="primary">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- Theme Toggle Button -->
    <button id="theme-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Theme">
        <i id="theme-icon" class="fas fa-moon"></i> <!-- Font Awesome moon icon -->
    </button>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/Chat.js"></script>
</body>
</html>
